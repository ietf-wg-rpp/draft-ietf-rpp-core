      - Status Value: clientUpdateProhibited
        Set By: client
        Description: Requests to update the object (other than to remove this status) MUST be rejected.
      - Status Value: serverUpdateProhibited
        Set By: server
        Description: Requests to update the object (other than to remove this status) MUST be rejected.
      - Status Value: clientDeleteProhibited
        Set By: client
        Description: Requests to delete the object MUST be rejected.
      - Status Value: serverDeleteProhibited
        Set By: server
        Description: Requests to delete the object MUST be rejected.
      - Status Value: pendingCreate
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
      - Status Value: pendingUpdate
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
      - Status Value: pendingDelete
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
    subsections: []
  - heading: Allowed Transitions
    anchor: ''
    notes:
    - The following diagram describes the allowed status transitions for an organisation object. The `linked`,
      `clientLinkProhibited`, `serverLinkProhibited`, `clientUpdateProhibited`, `serverUpdateProhibited`,
      `clientDeleteProhibited`, and `serverDeleteProhibited` status values are additive flags that MAY
      be combined with the states shown below (subject to the Status Exclusions rules) and are not depicted
      as separate states; while present, the corresponding flag blocks the associated transition (new
      link, update, or delete, respectively) from being initiated. The `linked` status is set and removed
      by the server as associations with other objects are added or removed, independently of the transitions
      described below.
    - 'State descriptions:'
    - 1. A create operation is received and processed. If the server defers completion, the object enters
      `pendingCreate` state. If the server completes the create immediately, the object enters the `ok`
      state directly. 2. The create action completes and the `pendingCreate` status is removed. The object
      enters the operational state (3), normally `ok`. 3. The object is in exactly one of the mutually
      exclusive operational states `ok`, `hold`, or `terminated`. The pending states (7) and (9) are entered
      from, and return to, this operational state. 4. A `hold` status is set. Organisation transform operations
      and new links MUST be rejected while the object is in `hold`. The `hold` status is set by the server,
      or by the client if the organisation has a parent organisation and server policy allows it. 5. The
      `hold` status is removed and the object returns to `ok`, by the same parties that are allowed to
      set it. 6. A `terminated` status is set, from either `ok` or `hold`, by the same parties that are
      allowed to set `hold`. A terminated organisation MUST NOT be linked, and organisation transform
      operations and new links MUST be rejected. Whether and how an object can leave the `terminated`
      state is subject to server policy. 7. An update operation is received. If the server defers completion,
      the object enters `pendingUpdate` state. 8. The pending update completes, the `pendingUpdate` status
      is removed, and the object returns to its operational state. 9. A delete operation is received.
      If the server defers completion, the object enters `pendingDelete` state. 10. The pending delete
      is rejected by the server, the `pendingDelete` status is removed, and the object returns to its
      operational state. 11. The pending delete completes and the object is purged.
    tables: []
    subsections: []
  - heading: Pending Status Removal
    anchor: ''
    notes:
    - When the requested action has been completed, the pendingCreate, pendingDelete, or pendingUpdate
      status value MUST be removed.  All clients involved in the transaction MUST be notified using a
      service message that the action has been completed and that the status of the object has changed.
    tables: []
    subsections: []
  - heading: Status Exclusions
    anchor: ''
    notes:
    - The `linked` status MAY be combined with `clientLinkProhibited` or `serverLinkProhibited` if new
      links must be prohibited.
    - Other status combinations not expressly prohibited MAY be used.
    tables:
    - caption: Organisation Status Exclusions
      anchor: '{#tbl-organisation-status-exclusions}'
      columns:
      - Status Value
      - MUST NOT be combined with
      rows:
      - Status Value: pendingCreate, ok, hold, terminated
        MUST NOT be combined with: Each other (mutually exclusive); an organisation MUST have exactly
          one of these statuses
      - Status Value: ok
        MUST NOT be combined with: Any status other than `linked`
      - Status Value: pendingDelete
        MUST NOT be combined with: clientDeleteProhibited, serverDeleteProhibited
      - Status Value: pendingCreate, pendingDelete, pendingUpdate
        MUST NOT be combined with: Each other (mutually exclusive)
    subsections: []
  supported_processes: []
  conditions: []
  at_least_one_status_by_server: true
  status_not_required_for_client_request: true
- identifier: userStatus
  name: User Status Object
  object_type: Component
  unique_identifier: ''
  owner: ''
  extends: ''
  abstract: false
  description: Represents the status value associated with a User Data Object. A User Data Object MUST
    always have exactly one associated status value.
  preamble: []
  elements:
  - identifier: label
    name: Label
    cardinality: '1'
    mutability: create-only
    data_type: String
    description: machine-readable enum label of a status
    constraints: []
    restrictions:
      allowed_values:
      - active
      - pending
      - suspended
      - deactivated
      client_values:
      - suspended
      - deactivated
      server_only_values:
      - active
      - pending
    direct_access: false
    visibility: default
    notes: []
  - identifier: reason
    name: Reason
    cardinality: 0-1
    mutability: create-only
    data_type: String
    description: a human-readable text that describes the rationale for the status applied to the object.
    constraints:
    - None
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations: []
  subsections:
  - heading: Status Values
    anchor: '{#user-status-values}'
    notes:
    - The `pending` status value is server-managed. The `suspended` and `deactivated` status values are
      server-managed and MAY additionally be client-managed by a client with permission to manage users
      in the owning organisation, based on server policy. The `active` status value is set and removed
      by the server as other status values are added or removed.
    - 'The Set By column identifies the entity that adds and removes each status value: `client`, `server`,
      or `client, server` for a value that the server manages and that a client can also manage where
      server policy permits.'
    tables:
    - caption: User Status Values
      anchor: '{#tbl-user-status-values}'
      columns:
      - Status Value
      - Set By
      - Description
      rows:
      - Status Value: active
        Set By: server
        Description: This is the normal status value for a user that is permitted to authenticate and
          act within the permissions of its roles.
      - Status Value: pending
        Set By: server
        Description: The user has been created, but activation has not been completed by the server. Server
          operators can delay activation for a variety of reasons, such as to allow for verification of
          the user's details or human review. Requests authenticated as the user MUST be rejected.
      - Status Value: suspended
        Set By: client, server
        Description: The user has been temporarily suspended. Requests authenticated as the user MUST
          be rejected.
      - Status Value: deactivated
        Set By: client, server
        Description: The user has been deactivated. Requests authenticated as the user MUST be rejected.
    subsections: []
  - heading: Allowed Transitions
    anchor: ''
    notes:
    - The following diagram describes the allowed status transitions for a user object.
    - 'State descriptions:'
    - 1. A create operation is received and processed. If the server defers activation, the object enters
      the `pending` state. If the server activates the user immediately, the object enters the `active`
      state directly. 2. Activation completes and the `pending` status is replaced by `active`. 3. A `suspended`
      status is set, replacing `active`. 4. The `suspended` status is removed and the object returns to
      `active`, by the same parties that are allowed to set it. 5. A `deactivated` status is set, from
      either `active` or `suspended`. Whether and how an object can leave the `deactivated` state is subject
      to server policy. 6. A delete operation completes and the object is purged. A delete operation can
      be received in any state; only the transition from `deactivated` is depicted.
    tables: []
    subsections: []
  - heading: Pending Status Removal
    anchor: ''
    notes:
    - When activation has been completed, the `pending` status value MUST be replaced by `active`. The
      client that created the user MUST be notified using a service message that activation has been completed
      and that the status of the object has changed.
    tables: []
    subsections: []
  - heading: Status Exclusions
    anchor: ''
    notes: []
    tables:
    - caption: User Status Exclusions
      anchor: '{#tbl-user-status-exclusions}'
      columns:
      - Status Value
      - MUST NOT be combined with
      rows:
      - Status Value: active, pending, suspended, deactivated
        MUST NOT be combined with: Each other (mutually exclusive); a user MUST have exactly one of these
          statuses
    subsections: []
  supported_processes: []
  conditions: []
  at_least_one_status_by_server: true
  status_not_required_for_client_request: true
- identifier: dnsRecord
  name: DNS Resource Record Object
  object_type: Component
  unique_identifier: ''
  owner: ''
  extends: ''
  abstract: false
  description: Represents a single DNS resource record. The structure follows the top-level format of
    a DNS resource record as described in Section 3.2.1 of [@!RFC1035], adapted for use in provisioning.
    The RDATA field is represented as a structured object whose fields depend on the record type, following
    the RDATA presentation format described by the corresponding RFC defining the record type. This approach
    is aligned with [@I-D.simmen-rpp-dns-data].
  preamble: []
  elements:
  - identifier: name
    name: Name
    cardinality: '1'
    mutability: read-write
    data_type: String
    description: The owner name of the DNS entry. This MAY be the domain itself or a subordinate host
      name.
    constraints:
    - The value MUST be a syntactically valid DNS host name.
    - Absolute FQDNs (with trailing dot) and relative host names are allowed, as well as the "@" symbol
      representing the domain name itself.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: class
    name: Class
    cardinality: 0-1
    mutability: read-write
    data_type: String
    description: The DNS resource record class.
    constraints:
    - If present, the value MUST be chosen from Section 3.2.4 (CLASS values) of [@!RFC1035].
    - A client SHOULD omit this element. The server MUST assume "IN" as the default class and MAY decline
      other values.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: type
    name: Type
    cardinality: '1'
    mutability: read-write
    data_type: String
    description: The DNS resource record type, indicating the format of the RDATA field.
    constraints:
    - The value MUST be a valid string representation of a resource record type as defined in [@!RFC1035]
      or other RFC describing the record type.
    - Allowed values MAY be constrained by server policies. For domain provisioning, the type would typically
      be constrained to the allowed parent-side entries.
    - Values MUST be converted to lower case.
    - 'In EPP Compatibility Profile ([@!RFC5732]), the following record types MUST be supported: `ns`,
      `a`, and `aaaa`.'
    - 'In EPP Compatibility Profile with DNSSEC Extension [@RFC5910], the following record types MUST
      additionally be supported: `ds` and `dnskey`.'
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: rdata
    name: RDATA
    cardinality: '1'
    mutability: read-write
    data_type: Object
    description: The actual payload data of the DNS record. The structure of this object depends on the
      record type and MUST follow the RDATA presentation format described by the corresponding RFC. Property
      names MUST be written in camelCase. All property values MUST be represented as Strings encoding
      the presentation format of the value.
    constraints:
    - The fields within RDATA MUST match the expected structure for the given record type.
    - See (#rdata-structures) for required structures in the EPP Compatibility Profile.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations: []
  subsections:
  - heading: RDATA Structures in EPP Profile
    anchor: '{#rdata-structures}'
    notes:
    - This section defines the RDATA field structures required for interoperability in the EPP Compatibility
      Profile.
    - 'In EPP Compatibility Profile ([@!RFC5732]), the following RDATA structures MUST be supported:'
    - 'For NS records ([@!RFC1035], Section 3.3.11): `nsdname` (the fully qualified domain name of the
      name server).'
    - 'For A records ([@!RFC1035], Section 3.4.1): `address` (the IPv4 address in dotted-decimal notation).'
    - 'For AAAA records ([@RFC3596], Section 2.2): `address` (the IPv6 address in text representation
      as defined in [@!RFC5952]).'
    - 'In EPP Compatibility Profile with DNSSEC Extension ([@RFC5910]), the following RDATA structures
      MUST additionally be supported:'
    - 'For DS records ([@RFC4034], Section 5): `keyTag` (key tag value), `algorithm` (algorithm number),
      `digestType` (digest algorithm type), and `digest` (digest value).'
    - 'For DNSKEY records ([@RFC4034], Section 2): `flags` (flags field value), `protocol` (protocol field
      value), `algorithm` (algorithm number), and `publicKey` (encoded public key value).'
    tables: []
    subsections: []
  supported_processes: []
  conditions: []
- identifier: dnsControls
  name: DNS Operational Controls Object
  object_type: Component
  unique_identifier: ''
  owner: ''
  extends: ''
  abstract: false
  description: Contains operational control parameters that a client MAY use to influence server-side
    DNS behaviour for a set of DNS records. A server MAY ignore these values, e.g. for policy reasons.
    This structure is aligned with [@I-D.simmen-rpp-dns-data].
  preamble: []
  elements:
  - identifier: ttl
    name: TTL
    cardinality: 0-1
    mutability: read-write
    data_type: Dictionary[Integer]
    description: Controls the caching behaviour of DNS resource records. The dictionary is keyed by lower-case
      record type name, with values representing the TTL in seconds for that record type.
    constraints:
    - The allowed value ranges MAY be constrained by server policy.
    - A server MAY ignore client-specified TTL values and apply default or policy-defined values.
    restrictions:
      key_pattern: ^[a-z][a-z0-9-]*$
      value_range:
        min: 1
    direct_access: false
    visibility: default
    notes: []
  - identifier: maxSigLifetime
    name: Maximum Signature Lifetime
    cardinality: 0-1
    mutability: read-write
    data_type: Dictionary[Integer]
    description: Specifies a child's preference for the maximum number of seconds after signature generation
      when the parent's signature on signed DNS information should expire. The dictionary is keyed by
      lower-case record type name, with values representing the maximum signature lifetime in seconds
      for that record type. The value applies to the RRSIG resource record over the signed DNS RRset.
      See Section 3 of [@RFC4034] for information on the RRSIG resource record. This corresponds to the
      maxSigLife concept from [@RFC5910].
    constraints:
    - A server MAY ignore client-specified values and apply its own default signature expiration policy.
    restrictions:
      key_pattern: ^[a-z][a-z0-9-]*$
      value_range:
        min: 1
    direct_access: false
    visibility: default
    notes: []
  operations: []
  subsections: []
  supported_processes: []
  conditions: []
- identifier: dnsData
  name: DNS Data Object
  object_type: Component
  unique_identifier: ''
  owner: ''
  extends: ''
  abstract: false
  description: A container for DNS resource records and associated operational controls for a provisioned
    object. This structure groups DNS records together with control parameters that influence server-side
    DNS behaviour. The structure is aligned with [@I-D.simmen-rpp-dns-data].
  preamble: []
  elements:
  - identifier: records
    name: Records
    cardinality: 0+
    mutability: read-write
    data_type: DNS Resource Record Object
    description: An array of DNS resource records associated with the provisioned object.
    constraints:
    - Allowed record types MAY be constrained by server policy.
    - In EPP Compatibility Profile with DNSSEC Extension [@RFC5910], records of type DS and DNSKEY MUST
      be supported in addition to NS, A, and AAAA.
    - A server MUST support either DS or DNSKEY or both record types for DNSSEC provisioning. If provided
      with only DNSKEY, a server MUST calculate the DS record. If both record types are provided, a server
      MAY use the DNSKEY to validate the DS record.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: controls
    name: Controls
    cardinality: 0-1
    mutability: read-write
    data_type: DNS Operational Controls Object
    description: Operational control parameters for the DNS records.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations: []
  subsections: []
  supported_processes: []
  conditions: []
