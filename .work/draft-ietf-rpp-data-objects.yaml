# RPP Data Objects — Structured Object Model
#
# Generated by check_iana_consistency.py --yaml-out <path>. Reflects the
# NORMATIVE object definitions in the draft body (Component Objects, Process
# Objects, and Resource/Data Objects) — not the IANA registry tables, which
# are a separate, derived source checked for consistency against this model
# by the same script's --check pass.
#
# Regenerate after editing the source draft; do not hand-edit this file.
#
# --- Top-level structure ---------------------------------------------------
#
# section_notes:
#   Free-form intro prose that precedes the first object in a normative H1
#   section and is not attached to any single object (e.g. the paragraph
#   directly under "# Process Objects" before the first "## ... Object"
#   heading). Keyed by the literal H1 heading text. Intro prose of a group
#   heading inside an envelope section (e.g. "## Messages", whose children
#   are the message objects) is also listed here, keyed by the group's
#   literal heading text. Absent for sections with
#   no such intro (most Resource/Data Object sections start immediately with
#   the object's own header bullets, so they have no entry here).
#
# common_data_types:
#   One entry per H2 heading under "# Common Data Types" (Identifier,
#   Client Identifier, Phone Number, ...):
#     name:         the heading text, as used in elements' data_type
#     anchor:       its "{#...}" anchor, or ""
#     description:  its prose, one entry per paragraph/bullet (asides
#                   dropped), minus any fragment mapped into restrictions
#     restrictions: structured syntax, from prose_mappings.yaml (see
#                   "Restrictions and conditions" below); {} if none
#
# components / processes / resources:
#   One list per Object Type (Component, Process, Resource), each entry
#   built from the object's normative definition:
#
#     identifier:   camelCase machine-readable Identifier bullet
#     name:         human-readable Name bullet
#     object_type:  "Component" | "Process" | "Resource"
#     unique_identifier: the object's "* Unique Identifier:" header bullet —
#                   the identifier of the element that identifies an
#                   instance (e.g. "name", "processId"). Empty string when
#                   the bullet is absent or "(None)": the object has no
#                   identity of its own (Component Objects, Discovery).
#     owner:        for an object-specific Process Object, the identifier of
#                   its Owner Data Object — the Data Object whose
#                   "## Processes" section contains its definition (taken
#                   from the heading nesting only). Empty string otherwise.
#     description:  the object's own "* Description:" bullet (may cite
#                   external references, e.g. "[@!RFC8543]")
#     preamble:     orphan prose found between the object's header bullets
#                   and its first element/operation — e.g. explanatory text
#                   that appears in the source but isn't itself a
#                   Name/Identifier/Description/Constraints attribute.
#                   Empty list if none.
#     elements:     every persisted data element, in document order
#     operations:   every operation (Resource/Process objects only), in
#                   document order
#     subsections:  non-Operations H3 subsections nested inside the object's
#                   own H2 (e.g. "### RDATA Structures in EPP Profile
#                   {#rdata-structures}" inside the dnsRecord Component
#                   Object) — content that belongs to the object but is
#                   neither a data element nor an operation. Empty list if
#                   the object has none. Each entry:
#                     heading: the subsection's heading text
#                     anchor:  its "{#...}" anchor, or "" if none
#                     notes:   its own body text, in document order — each
#                              prose paragraph and each top-level bullet
#                              becomes one list entry (bullets fold deeper
#                              nesting into that same entry, same as
#                              Constraints). Tables are not repeated
#                              here; fenced blocks (diagrams) and their
#                              "Figure:" captions are not exported.
#                     tables:  every pipe table in its own body:
#                                caption: text of the "Table:" line, or ""
#                                anchor:  its "{#...}" anchor, or ""
#                                columns: the header cells, in order
#                                rows:    one {column: cell} map per row
#                     subsections: headings one level deeper, same shape,
#                              recursively (e.g. "Allowed Transitions" under
#                              "Redemption Grace Period")
#     extends:      the object's "* Extends:" attribute — the NAME (not the
#                   identifier) of the object this one extends, e.g. a
#                   Domain Transfer Process Object extends "Transfer Process
#                   Object". Empty string for objects that extend nothing.
#     conditions:   cross-element rules from prose_mappings.yaml, e.g.
#                   {if: {transferDir: push}, require: [gainingClientId]}:
#                   when every "if" element has the given value, the
#                   "require" elements MUST and the "forbid" elements MUST
#                   NOT be present. [] if none.
#     at_least_one_status_by_server: (status Component Objects only, present
#                   only when prose_mappings.yaml maps it) true when the
#                   server always assigns at least one of the object's
#                   status values.
#     status_not_required_for_client_request: (same) true when a client
#                   may omit status values when creating or updating the
#                   object that holds them.
#     abstract:     true if the object's preamble has "* Abstract: true" —
#                   the object is used only as a base object and no instance
#                   ever has it as its own type (e.g. Base Process Object).
#                   false when the attribute is absent or "false".
#     supported_processes: the INHERITED-process bullet list from a Data
#                   Object's "## Processes" section — the Process Objects it
#                   supports UNMODIFIED. Processes it *extends* are not
#                   listed here: they appear as their own Process Object
#                   entries (under "processes") carrying "extends". Empty
#                   list if the object declares none. Each entry:
#                     name:       the reference to the Process Object, by
#                                 Object Name — the bullet text itself
#                                 (there is no separate identifier, which
#                                 would be a redundant second key). The
#                                 short form is accepted: "Renew Process"
#                                 refers to "Renew Process Object".
#                                 Bracketed parts (e.g. an "(#anchor)"
#                                 reference) are dropped.
#                     constraints: list of strings — same convention as an
#                                 element's Constraints
#                     notes:      orphan prose inside this entry's own block.
#                                 Empty list if none.
#
#   Each element entry:
#     identifier, name, cardinality, mutability, data_type: as defined in
#       the "Data Element Definitions" convention (CLAUDE.md)
#     description:  the element's "* Description:" bullet (a single string)
#     constraints:  the element's "* Constraints:" bullet as a LIST of
#                   strings, one per top-level constraint. A single inline
#                   value ("Constraints: MUST be positive.") becomes a
#                   one-item list; "(None)" (or nothing at all) becomes an
#                   empty list []. When the source instead has a blank
#                   "Constraints:" line followed by a nested bullet list
#                   (e.g. the Status Object's "label" element), each
#                   top-level nested bullet becomes one list entry, with any
#                   further nesting under it (a sub-list, a numbered list)
#                   folded into that same entry as extra newline-joined
#                   lines, keeping the original markers (e.g. "1.", "2.").
#                   A constraint mapped into restrictions is removed here.
#     restrictions: structured value rules mapped from prose (see
#                   "Restrictions and conditions" below); {} if none
#     direct_access: the element's "* Direct Access:" bullet as a boolean;
#                   false when absent (the draft's default)
#     visibility:   the element's "* Visibility:" bullet, "default" or
#                   "onDemand"; "default" when absent (the draft's default)
#     notes:        orphan prose inside the element's own block not captured
#                   by any of the fields above (e.g. a stray unstructured
#                   paragraph). Empty list if none. A table found in any
#                   orphan-prose location is kept as one verbatim,
#                   newline-joined entry; a fenced block is skipped.
#
#   Each operation entry:
#     identifier, name: as defined in the operation heading /
#       "* Identifier:" bullet; bracketed parts of the heading are
#       dropped ("Delete (Transfer Cancel)" -> "Delete")
#     description:  plain prose describing the operation (this document's
#                   convention: NOT a "* Description:" bullet, which is
#                   element/object-only — every operation's description is
#                   prose written directly after its "* Identifier:" bullet).
#                   Covers every prose paragraph between "* Identifier:" and
#                   the first "* Authorisation:"/"* Input:"/"* Output:"
#                   bullet, newline-joined if there is more than one
#                   paragraph.
#     authorisation: the operation's "* Authorisation:" bullet as a LIST of
#                   strings, one per top-level sub-bullet (same
#                   nested-bullet folding as an element's "constraints" —
#                   deeper nesting, e.g. "Pull transfer:"/"Push transfer:"
#                   sub-cases, is newline-joined into that entry). Empty
#                   list if the operation has no Authorisation bullet.
#     input:        the operation's "* Input:" items, in the draft's
#                   "Operation Input and Output" notation; [] for "(None)".
#                   A Data Object operation that declares no Input gets the
#                   Uniform interface default for its identifier. Each
#                   Reference / Object item:
#                     kind:        "Reference" | "Object"
#                     target:      an object Name, "This Object" (the object
#                                  defining the operation) or "Owner Data
#                                  Object" (of a Process Object)
#                     cardinality: number of representations ("1" unless
#                                  an Object item says otherwise)
#                   An "Input Data Elements" (content the operation acts
#                   upon) / "Parameters" (controls processing or output)
#                   item — Input only, at most once each, neither part of
#                   the object's state:
#                     kind:        "Input Data Elements" | "Parameters"
#                     definitions: one entry per definition, laid out like
#                                  the draft's "* Data Elements:" list:
#                                  identifier, name, cardinality,
#                                  data_type, description, constraints,
#                                  restrictions, notes — same meaning as
#                                  for elements
#                   null only if neither the operation nor a default
#                   declares it (reported as [OP IO MISSING]).
#     output:       the operation's "* Output:" items, same rules as input.
#     notes:        orphan prose in the operation's body beyond description/
#                   authorisation/input/output (e.g. a further explanatory
#                   paragraph after the Authorisation bullet). Empty list
#                   if none.
#
# --- Restrictions and conditions -------------------------------------------
#
# Facts the draft states only in prose are exported in structured form when
# .scripts/prose_mappings.yaml lists the exact sentence: the sentence is
# removed from its description/constraints and replaced by these fields.
# Prose not listed there stays as text. restrictions keys (each optional):
#   base_type             primitive type a Common Data Type is built on
#   allowed_values        closed list of permitted values (for a status
#                         label, resolved from the draft's status table)
#   client_values         status values a client may add and remove (Set By
#                         column "client" or "client, server")
#   server_only_values    status values only the server adds and removes
#                         (Set By column "server"); together with
#                         client_values it partitions allowed_values
#   range                 {min, max} of a scalar value, inclusive
#   pattern               regular expression the whole value matches
#   min_length/max_length length bounds of a string value
#   key_pattern           regular expression every Dictionary key matches
#   value_range           {min, max} of every Dictionary value, inclusive
#
# Every attribute bullet in the draft has a field here: an element, input
# or parameter attribute the export does not cover makes --yaml-out fail
# instead of writing this file ([ELEM ATTR UNKNOWN],
# [INPUT|PARAM ATTR NOT APPLICABLE]).
#
# Nothing here duplicates content already captured in a structured field:
# "notes"/"preamble"/"section_notes" contain ONLY the leftover prose the
# script could not attribute to a Name/Identifier/Cardinality/Mutability/
# Data Type/Description/Constraints bullet. Editorial aside notes ("A>"
# blocks, e.g. TODO/TBD/TBC markers) are intentionally excluded everywhere.
# -----------------------------------------------------------------------------


section_notes:
  '# Component Objects':
  - This section defines the Component Objects used in this document.
  '# Process Objects {#process-objects}':
  - This section defines the Process Objects used in this document.
  - Each Process Object extends the Base Process Object (#base-process) and therefore carries its OPTIONAL
    Process ID data element.
  '## Availability {#availability}':
  - The Availability Objects define the output of the Availability operation (see (#uniform-availability)).
    Each Data Object that supports the Availability operation defines its own Availability Object extending
    the Base Availability Object. Extensions add availability information, for example pricing, as data
    elements of these objects.
  '## Messages':
  - The Message Components define the structure and data elements for all message objects used in the
    protocol. Each specific message type extends the Base Message Object to include additional data elements
    relevant to that message type. Any of the types defined in this section may be used for the `data`
    data element defined for the Message Data Object.
common_data_types:
- name: Identifier
  anchor: ''
  description:
  - Identifiers are character strings with a specified minimum length, a specified maximum length, and
    a specified format outlined in [@!RFC5730, section 2.8]. Identifiers for certain object types MAY
    have additional constraints imposed either by server policy, object specific specifications or both.
  restrictions: {}
- name: Client Identifier
  anchor: ''
  description: []
  restrictions:
    base_type: String
    min_length: 3
    max_length: 16
    pattern: ^\S+( \S+)*$
- name: Phone Number
  anchor: ''
  description:
  - Telephone number syntax is derived from structures defined in [@!ITU.E164.2005].
  restrictions:
    base_type: String
    pattern: ^\+[0-9]{1,3}\.[0-9]{1,14}(x[0-9]+)?$
components:
- identifier: period
  name: Period Object
  object_type: Component
  unique_identifier: ''
  owner: ''
  extends: ''
  abstract: false
  description: Represents a duration of time.
  preamble: []
  elements:
  - identifier: value
    name: Value
    cardinality: '1'
    mutability: read-write
    data_type: Integer
    description: The numeric value of the period.
    constraints: []
    restrictions:
      range:
        min: 1
        max: 99
    direct_access: false
    visibility: default
    notes: []
  - identifier: unit
    name: Unit
    cardinality: '1'
    mutability: read-write
    data_type: String
    description: The unit of the period.
    constraints: []
    restrictions:
      allowed_values:
      - y
      - m
    direct_access: false
    visibility: default
    notes: []
  operations: []
  subsections: []
  supported_processes: []
  conditions: []
- identifier: provMetadata
  name: Provisioning Metadata Object
  object_type: Component
  unique_identifier: ''
  owner: ''
  extends: ''
  abstract: false
  description: Contains standard metadata about the lifecycle and ownership of a provisioned object. This
    metadata is common across all resource objects in the registry system.
  preamble: []
  elements:
  - identifier: repositoryId
    name: Repository ID
    cardinality: 0-1
    mutability: read-only
    data_type: Identifier
    description: A server-assigned unique identifier for the object.
    constraints:
    - In EPP Compatibility Profile this data element MUST be provided.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: spClientId
    name: Sponsoring Client ID
    cardinality: '1'
    mutability: read-only
    data_type: Client Identifier
    description: The identifier of the client that is the current sponsor of the object.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: crClientId
    name: Creating Client ID
    cardinality: 0-1
    mutability: read-only
    data_type: Client Identifier
    description: The identifier of the client that created the object.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: crDate
    name: Creation Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time of object creation.
    constraints:
    - The value is set by the server and cannot be specified by the client.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: upClientId
    name: Updating Client ID
    cardinality: 0-1
    mutability: read-only
    data_type: Client Identifier
    description: The identifier of the client that last updated the object.
    constraints:
    - This element MUST NOT be present if the object has never been modified.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: upDate
    name: Update Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time of the most recent object modification.
    constraints:
    - This element MUST NOT be present if the object has never been modified.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: trDate
    name: Transfer Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time of the most recent successful object transfer.
    constraints:
    - This element MUST NOT be provided if the object has never been transferred.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations: []
  subsections: []
  supported_processes: []
  conditions: []
- identifier: domainStatus
  name: Domain Name Status Object
  object_type: Component
  unique_identifier: ''
  owner: ''
  extends: ''
  abstract: false
  description: Represents one of the status values associated with a Domain Name Data Object
  preamble: []
  elements:
  - identifier: label
    name: Label
    cardinality: '1'
    mutability: create-only
    data_type: String
    description: machine-readable enum label of a status
    constraints: []
    restrictions:
      allowed_values:
      - clientDeleteProhibited
      - serverDeleteProhibited
      - clientHold
      - serverHold
      - clientRenewProhibited
      - serverRenewProhibited
      - clientTransferProhibited
      - serverTransferProhibited
      - clientUpdateProhibited
      - serverUpdateProhibited
      - inactive
      - ok
      - pendingCreate
      - pendingDelete
      - pendingRenew
      - pendingTransfer
      - pendingUpdate
      - rgpAddPeriod
      - rgpAutoRenewPeriod
      - rgpRenewPeriod
      - rgpTransferPeriod
      - rgpRedemptionPeriod
      - rgpPendingRestore
      - rgpPendingDelete
      client_values:
      - clientDeleteProhibited
      - clientHold
      - clientRenewProhibited
      - clientTransferProhibited
      - clientUpdateProhibited
      server_only_values:
      - serverDeleteProhibited
      - serverHold
      - serverRenewProhibited
      - serverTransferProhibited
      - serverUpdateProhibited
      - inactive
      - ok
      - pendingCreate
      - pendingDelete
      - pendingRenew
      - pendingTransfer
      - pendingUpdate
      - rgpAddPeriod
      - rgpAutoRenewPeriod
      - rgpRenewPeriod
      - rgpTransferPeriod
      - rgpRedemptionPeriod
      - rgpPendingRestore
      - rgpPendingDelete
    direct_access: false
    visibility: default
    notes: []
  - identifier: reason
    name: Reason
    cardinality: 0-1
    mutability: create-only
    data_type: String
    description: a human-readable text that describes the rationale for the status applied to the object.
    constraints:
    - None
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: due
    name: Due
    cardinality: 0-1
    mutability: read-write
    data_type: Timestamp
    description: a timestamp, when this status is going to be removed automatically, or changed to other
      status. This field can be used to express lifecycle related information.
    constraints:
    - servers MAY restrict possibility to set or update this value by the client.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations: []
  subsections:
  - heading: Status Values
    anchor: '{#domain-status-values}'
    notes:
    - Status values that can be added or removed by a client are prefixed with "client".  Corresponding
      status values that can be added or removed by a server are prefixed with "server".  Status values
      that do not begin with either "client" or "server" are server-managed. Status values that begin
      with "rgp" are related to the Redemption Grace Period (RGP) and are also server-managed. A client
      MUST NOT alter status values set by the server. A server MAY alter or override status values set
      by a client, subject to local server policies.
    - 'The Set By column identifies the entity that adds and removes each status value: `client`, `server`,
      or `client, server` for a value that the server manages and that a client can also manage where
      server policy permits.'
    tables:
    - caption: Domain Name Status Values
      anchor: '{#tbl-domain-status-values}'
      columns:
      - Status Value
      - Set By
      - Description
      rows:
      - Status Value: clientDeleteProhibited
        Set By: client
        Description: Requests to delete the object MUST be rejected.
      - Status Value: serverDeleteProhibited
        Set By: server
        Description: Requests to delete the object MUST be rejected.
      - Status Value: clientHold
        Set By: client
        Description: DNS delegation information MUST NOT be published for the object.
      - Status Value: serverHold
        Set By: server
        Description: DNS delegation information MUST NOT be published for the object.
      - Status Value: clientRenewProhibited
        Set By: client
        Description: Requests to renew the object MUST be rejected.
      - Status Value: serverRenewProhibited
        Set By: server
        Description: Requests to renew the object MUST be rejected.
      - Status Value: clientTransferProhibited
        Set By: client
        Description: Requests to transfer the object MUST be rejected.
      - Status Value: serverTransferProhibited
        Set By: server
        Description: Requests to transfer the object MUST be rejected.
      - Status Value: clientUpdateProhibited
        Set By: client
        Description: Requests to update the object (other than to remove this status) MUST be rejected.
      - Status Value: serverUpdateProhibited
        Set By: server
        Description: Requests to update the object (other than to remove this status) MUST be rejected.
      - Status Value: inactive
        Set By: server
        Description: Delegation information has not been associated with the object. This is the default
          status when a domain object is first created and there are no associated host objects for the
          DNS delegation. This status can also be set by the server when all host-object associations
          are removed.
      - Status Value: ok
        Set By: server
        Description: This is the normal status value for an object that has no pending operations or prohibitions.
          This value is set and removed by the server as other status values are added or removed.
      - Status Value: pendingCreate
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
      - Status Value: pendingDelete
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
      - Status Value: pendingRenew
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
      - Status Value: pendingTransfer
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
      - Status Value: pendingUpdate
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
    subsections: []
  - heading: Allowed Transitions
    anchor: ''
    notes:
    - The following diagram describes the allowed status transitions for a domain object, excluding the
      "rgp" status values, which follow the separate Redemption Grace Period State Diagram below. The
      `clientHold`, `serverHold`, `clientDeleteProhibited`, `serverDeleteProhibited`, `clientRenewProhibited`,
      `serverRenewProhibited`, `clientTransferProhibited`, `serverTransferProhibited`, `clientUpdateProhibited`,
      and `serverUpdateProhibited` status values are additive flags that MAY be combined with the states
      shown below (subject to the Status Exclusions rules) and are not depicted as separate states; while
      present, the corresponding flag blocks the associated transition (delete, renew, transfer, or update,
      respectively) from being initiated.
    - 'State descriptions:'
    - 1. A create operation is received and processed. If the server defers completion, the object enters
      `pendingCreate` state. 2. The create action completes. The object transitions to `ok` if one or
      more nameservers are associated with the domain, or to `inactive` if none are associated. 3. The
      object is in normal operation, either as `ok` (nameservers associated) or `inactive` (no nameservers
      associated). The object toggles between these two sub-states as nameserver associations are added
      to or removed from the domain, independently of the transitions described below. 4. An update operation
      is received. If the server defers completion, the object enters `pendingUpdate` state. 5. A renew
      operation is received to extend the domain's registration period. If the server defers completion,
      the object enters `pendingRenew` state. 6. A transfer Create operation is received, initiating a
      transfer request. The object enters `pendingTransfer` state while the request awaits approval, rejection,
      or automated server action. 7. Once the pending update, renew, or transfer action completes, the
      corresponding pending status is removed and the object returns to its `ok` or `inactive` state,
      as determined by its current nameserver associations. 8. A delete operation is received and processed.
      The object enters `pendingDelete` state. 9. Whether RGP is supported for the domain determines the
      next transition upon completion of the pending delete action. 10. If RGP is not supported, the object
      is purged once the delete action completes. If RGP is supported, the object instead continues into
      the `rgpRedemptionPeriod` state, following the [Redemption Grace Period State Diagram](#fig-rgp-state-diagram)
      below.
    tables: []
    subsections: []
  - heading: Pending Status Removal
    anchor: ''
    notes:
    - When the requested action has been completed, the pendingCreate, pendingDelete, pendingRenew, pendingTransfer,
      or pendingUpdate status value MUST be removed.  All clients involved in the transaction MUST be
      notified using a service message that the action has been completed and that the status of the object
      has changed.
    tables: []
    subsections: []
  - heading: Status Exclusions
    anchor: ''
    notes:
    - Other status combinations not expressly prohibited MAY be used.
    tables:
    - caption: Status Exclusions
      anchor: '{#tbl-status-exclusions}'
      columns:
      - Status Value
      - MUST NOT be combined with
      rows:
      - Status Value: ok
        MUST NOT be combined with: Any other status
      - Status Value: pendingDelete
        MUST NOT be combined with: clientDeleteProhibited, serverDeleteProhibited
      - Status Value: pendingRenew
        MUST NOT be combined with: clientRenewProhibited, serverRenewProhibited
      - Status Value: pendingTransfer
        MUST NOT be combined with: clientTransferProhibited, serverTransferProhibited
      - Status Value: pendingUpdate
        MUST NOT be combined with: clientUpdateProhibited, serverUpdateProhibited
      - Status Value: pendingCreate, pendingDelete, pendingRenew, pendingTransfer, pendingUpdate
        MUST NOT be combined with: Each other (mutually exclusive)
    subsections: []
  - heading: Redemption Grace Period
    anchor: '{#rgp-status-values}'
    notes:
    - Status values that begin with "rgp" are related to the Redemption Grace Period (RGP) and are server-managed.
    - 'The Set By column identifies the entity that adds and removes each status value: `client`, `server`,
      or `client, server` for a value that the server manages and that a client can also manage where
      server policy permits.'
    tables:
    - caption: Redemption Grace Period Status Values
      anchor: '{#tbl-rgp-status-values}'
      columns:
      - Status Value
      - Set By
      - Description
      rows:
      - Status Value: rgpAddPeriod
        Set By: server
        Description: This grace period is provided after the initial registration of a domain name. If
          the domain name is deleted by the registrar during this period, the registry provides a credit
          to the registrar for the cost of the registration.
      - Status Value: rgpAutoRenewPeriod
        Set By: server
        Description: This grace period is provided after a domain name registration period expires and
          is extended (renewed) automatically by the registry. If the domain name is deleted by the registrar
          during this period, the registry provides a credit to the registrar for the cost of the renewal.
      - Status Value: rgpRenewPeriod
        Set By: server
        Description: This grace period is provided after a domain name registration period is explicitly
          extended (renewed) by the registrar. If the domain name is deleted by the registrar during this
          period, the registry provides a credit to the registrar for the cost of the renewal.
      - Status Value: rgpTransferPeriod
        Set By: server
        Description: This grace period is provided after the successful transfer of domain name registration
          sponsorship from one registrar to another registrar. If the domain name is deleted by the new
          sponsoring registrar during this period, the registry provides a credit to the registrar for
          the cost of the transfer.
      - Status Value: rgpRedemptionPeriod
        Set By: server
        Description: This status value is used to describe a domain for which a delete operation has been
          received, but the domain has not yet been purged because an opportunity exists to restore the
          domain and abort the deletion process.
      - Status Value: rgpPendingRestore
        Set By: server
        Description: This status value is used to describe a domain that is in the process of being restored
          after being in the rgpRedemptionPeriod state.
      - Status Value: rgpPendingDelete
        Set By: server
        Description: This status value is used to describe a domain that has entered the purge processing
          state after completing the rgpRedemptionPeriod state.  A domain in this status MUST also be
          in the pendingDelete status described above.
    subsections:
    - heading: Allowed Transitions
      anchor: ''
      notes:
      - The following state diagram describes the object lifecycle when the Redemption Grace Period (RGP)
        feature is supported. It adapts the diagram from [@!RFC3915, section 2] to the RPP data model,
        using RPP status labels and operations instead of EPP command names.
      - In the diagram below, each state box shows the values of the `status` data element of the Domain
        Name Data Object. The values `ok` and `pendingDelete` are defined in (#domain-status-values),
        and the values beginning with "rgp" are defined in (#rgp-status-values). The `<delete>` label
        refers to the Delete operation on the Domain Name Data Object. The `<create>` and `<update>` labels
        refer to the Create operation ((#restore-create)) and the Update operation ((#restore-report))
        of the Restore Process Object.
      - 'State descriptions:'
      - 1. The object is in normal operation (`ok` or other status allowing a delete operation). 2. A
        delete operation is received and processed. 3. RGP begins. The object enters `pendingDelete` +
        `rgpRedemptionPeriod` state. The object remains here until a restore operation is requested or
        the redemption period elapses. 4. A restore Create operation is submitted. The registry accepts
        the request. Go to step 9 if the redemption period elapses before a restore is received (4a).
        5. If the server does not require a restore report, the object returns to its pre-deletion status
        (1) immediately upon a successful Create operation. If the server requires a report but the client
        includes it inline in the Create operation, the server processes both atomically and the object
        transitions directly from `rgpRedemptionPeriod` to its pre-deletion status (1), bypassing the
        `rgpPendingRestore` state. 6. The object enters `pendingDelete` + `rgpPendingRestore` state. The
        registry awaits a restore report from the sponsoring client. 7. If no restore report is received
        within the registry-defined time, the object returns to `rgpRedemptionPeriod` state (step 3).
        8. If a restore report is received and accepted, the object returns to its pre-deletion status
        and all RGP status labels are removed. 9. The redemption period elapses without a restore request
        being received. 10. The object enters `pendingDelete` + `rgpPendingDelete` state and awaits final
        purge processing. 11. The pending delete period elapses and the object is purged. 12. The object
        is purged and available for re-registration.
      tables: []
      subsections: []
  supported_processes: []
  conditions: []
  at_least_one_status_by_server: true
  status_not_required_for_client_request: true
- identifier: hostStatus
