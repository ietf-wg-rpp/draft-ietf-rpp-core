processes:
- identifier: transferProcess
  name: Transfer Process Object
  object_type: Process
  unique_identifier: processId
  owner: ''
  extends: Base Process Object
  abstract: false
  description: Represents a transfer request for a provisioned object. Creating this object initiates
    a transfer. The object supports approve and reject as additional operations, and delete as the cancel
    operation. Reading the object returns the current transfer status.
  preamble: []
  elements:
  - identifier: transferDir
    name: Transfer Direction
    cardinality: 0-1
    mutability: create-only
    data_type: String
    description: Indicates whether the transfer is a "pull" or "push" transfer. Per policy, servers usually
      support only one model. If omitted, server policy determines the default.
    constraints: []
    restrictions:
      allowed_values:
      - pull
      - push
    direct_access: false
    visibility: default
    notes: []
  - identifier: gainingClientId
    name: Gaining Client ID
    cardinality: 0-1
    mutability: create-only
    data_type: Client Identifier
    description: The identifier of the designated gaining client.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: trStatus
    name: Transfer Status
    cardinality: '1'
    mutability: read-only
    data_type: String
    description: The state of the transfer request.
    constraints: []
    restrictions:
      allowed_values:
      - pending
      - clientApproved
      - clientCancelled
      - clientRejected
      - serverApproved
      - serverCancelled
    direct_access: false
    visibility: default
    notes: []
  - identifier: reqClientId
    name: Requesting Client ID
    cardinality: '1'
    mutability: read-only
    data_type: Client Identifier
    description: The identifier of the client that initiated the transfer request.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: requestDate
    name: Request Date
    cardinality: '1'
    mutability: read-only
    data_type: Timestamp
    description: The date and time that the transfer was requested.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: actClientId
    name: Acting Client ID
    cardinality: '1'
    mutability: read-only
    data_type: Client Identifier
    description: For a pending pull transfer, the identifier of the sponsoring client that SHOULD act
      upon the request. For a pending push transfer, the identifier of the designated gaining client that
      SHOULD act upon the request. For all other statuses, the identifier of the client that took the
      indicated action.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: actionDate
    name: Action Date
    cardinality: '1'
    mutability: read-only
    data_type: Timestamp
    description: For a pending request, the date and time by which a response is required before an automated
      response action SHOULD be taken by the server. For all other statuses, the date and time when the
      request was completed.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations:
  - identifier: transferCreate
    name: Create
    description: The Create operation initiates a transfer by creating a Transfer Process Object associated
      with the provisioned object. The transfer direction and gaining client (for push transfers) are
      provided as `create-only` data elements of the Transfer Process Object.
    authorisation:
    - 'Pull transfer:

      * The requesting client (gaining client) MUST provide valid Object Authorisation.'
    - 'Push transfer:

      * Only the sponsoring client is authorised to initiate a push transfer.'
    input:
    - kind: Reference
      target: Owner Data Object
      cardinality: '1'
    - kind: Object
      target: Transfer Process Object
      cardinality: '1'
    output:
    - kind: Object
      target: Transfer Process Object
      cardinality: '1'
    notes: []
  - identifier: transferRead
    name: Read
    description: The Read operation allows a client to determine the real-time status of a pending or
      recently completed transfer request.
    authorisation:
    - This operation MUST be accessible to both the sponsoring client and the gaining client.
    - Server policy determines whether other clients may query transfer status and what information is
      returned.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: Transfer Process Object
      cardinality: '1'
    notes: []
  - identifier: transferDelete
    name: Delete
    description: The Delete operation allows the initiating client to cancel its own pending transfer
      request.
    authorisation:
    - Only the initiating client (the client that originally requested the transfer).
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: Transfer Process Object
      cardinality: 0-1
    notes: []
  - identifier: transferApprove
    name: Approve
    description: The Approve operation allows the appropriate client to accept a pending transfer request.
    authorisation:
    - 'Pull transfer:

      * only the sponsoring client'
    - 'Push transfer:

      * only the designated gaining client'
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: Transfer Process Object
      cardinality: '1'
    notes: []
  - identifier: transferReject
    name: Reject
    description: The Reject operation allows the appropriate client to decline a pending transfer request.
    authorisation:
    - 'Pull transfer:

      * only the sponsoring client'
    - 'Push transfer:

      * only the designated gaining client'
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    - kind: Input Data Elements
      definitions:
      - identifier: reason
        name: Reason
        cardinality: 0-1
        data_type: String
        description: A human-readable text describing the rationale for rejecting the transfer request.
        constraints:
        - In EPP Compatibility Profile this data element MUST NOT be used
        restrictions: {}
        notes: []
    output:
    - kind: Object
      target: Transfer Process Object
      cardinality: '1'
    notes: []
  subsections: []
  supported_processes: []
  conditions:
  - if:
      transferDir: push
    require:
    - gainingClientId
  - if:
      transferDir: pull
    forbid:
    - gainingClientId
- identifier: restoreProcess
  name: Restore Process Object
  object_type: Process
  unique_identifier: processId
  owner: ''
  extends: Base Process Object
  abstract: false
  description: Represents the current state of a restore request for an object that has entered the Redemption
    Grace Period (RGP).
  preamble: []
  elements:
  - identifier: restoreStatus
    name: Restore Status
    cardinality: '1'
