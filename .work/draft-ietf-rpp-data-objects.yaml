    direct_access: false
    visibility: default
    notes: []
  operations: []
  subsections:
  - heading: Status Values
    anchor: '{#host-status-values}'
    notes:
    - Status values that can be added or removed by a client are prefixed with "client".  Corresponding
      status values that can be added or removed by a server are prefixed with "server".  Status values
      that do not begin with either "client" or "server" are server-managed. A client MUST NOT alter status
      values set by the server. A server MAY alter or override status values set by a client, subject
      to local server policies.
    - 'The Set By column identifies the entity that adds and removes each status value: `client`, `server`,
      or `client, server` for a value that the server manages and that a client can also manage where
      server policy permits.'
    tables:
    - caption: Host Status Values
      anchor: '{#tbl-host-status-values}'
      columns:
      - Status Value
      - Set By
      - Description
      rows:
      - Status Value: clientDeleteProhibited
        Set By: client
        Description: Requests to delete the object MUST be rejected.
      - Status Value: serverDeleteProhibited
        Set By: server
        Description: Requests to delete the object MUST be rejected.
      - Status Value: clientUpdateProhibited
        Set By: client
        Description: Requests to update the object (other than to remove this status) MUST be rejected.
      - Status Value: serverUpdateProhibited
        Set By: server
        Description: Requests to update the object (other than to remove this status) MUST be rejected.
      - Status Value: linked
        Set By: server
        Description: The host object has at least one active association with another object, such as
          a domain object. Servers SHOULD provide services to determine existing object associations.
      - Status Value: ok
        Set By: server
        Description: This is the normal status value for an object that has no pending operations or prohibitions.
          This value is set and removed by the server as other status values are added or removed.
      - Status Value: pendingCreate
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
      - Status Value: pendingDelete
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
      - Status Value: pendingTransfer
        Set By: server
        Description: A transform command has been processed for the object's superordinate domain object
          (i.e. a transfer of the domain object is pending), but the action has not been completed by
          the server. Server operators can delay action completion for a variety of reasons, such as to
          allow for human review or third-party action.
      - Status Value: pendingUpdate
        Set By: server
        Description: A transform command has been processed for the object, but the action has not been
          completed by the server. Server operators can delay action completion for a variety of reasons,
          such as to allow for human review or third-party action.
    subsections: []
  - heading: Allowed Transitions
    anchor: ''
    notes:
    - The following diagram describes the allowed status transitions for a host object, based on the status
      values defined in [@!RFC5732, section 2.3]. The `clientDeleteProhibited`, `serverDeleteProhibited`,
      `clientUpdateProhibited`, and `serverUpdateProhibited` status values are additive flags that MAY
      be combined with the states shown below (subject to the Status Exclusions rules) and are not depicted
      as separate states; while present, the corresponding flag blocks the associated transition (delete
      or update, respectively) from being initiated. The `linked` status is set and removed by the server
      as associations with other objects are added or removed, independently of the transitions described
      below.
    - 'State descriptions:'
    - 1. A create operation is received and processed. If the server defers completion, the object enters
      `pendingCreate` state. 2. The create action completes and the `pendingCreate` status is removed.
      The object enters the `ok` state. 3. The object is in normal operation with the `ok` status. The
      `linked` status MAY accompany `ok` while the host has an active association with another object,
      such as a domain object. 4. An update operation is received. If the server defers completion, the
      object enters `pendingUpdate` state. 5. A transfer of the superordinate domain object is initiated.
      The server sets the `pendingTransfer` status on the subordinate host object while the domain transfer
      request is pending. This status is not set by a client. 6. Once the pending update or transfer action
      completes, the corresponding pending status is removed and the object returns to its `ok` state.
      7. A delete operation is received and processed. The object enters `pendingDelete` state. 8. The
      pending delete action completes. 9. The object is purged.
    tables: []
    subsections: []
  - heading: Pending Status Removal
    anchor: ''
    notes:
    - When the requested action has been completed, the pendingCreate, pendingDelete, pendingTransfer,
      or pendingUpdate status value MUST be removed. All clients involved in the transaction MUST be notified
      using a service message that the action has been completed and that the status of the object has
      changed.
    tables: []
    subsections: []
  - heading: Status Exclusions
    anchor: ''
    notes:
    - The `linked` status MAY be combined with any status. Other status combinations not expressly prohibited
      MAY be used.
    tables:
    - caption: Host Status Exclusions
      anchor: '{#tbl-host-status-exclusions}'
      columns:
      - Status Value
      - MUST NOT be combined with
      rows:
      - Status Value: ok
        MUST NOT be combined with: Any status other than `linked`
      - Status Value: pendingDelete
        MUST NOT be combined with: clientDeleteProhibited, serverDeleteProhibited
      - Status Value: pendingUpdate
        MUST NOT be combined with: clientUpdateProhibited, serverUpdateProhibited
      - Status Value: pendingCreate, pendingDelete, pendingTransfer, pendingUpdate
        MUST NOT be combined with: Each other (mutually exclusive)
    subsections: []
  supported_processes: []
  conditions: []
  at_least_one_status_by_server: true
  status_not_required_for_client_request: true
