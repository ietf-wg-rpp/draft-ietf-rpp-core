  - identifier: reportDueDate
    name: Report Due Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time by which a restore report must be submitted before the object reverts
      to `rgpRedemptionPeriod` state. Only present when the object is in `rgpPendingRestore` state.
    constraints:
    - MUST NOT be present when `restoreStatus` is not `"pendingRestore"`.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: restoreReport
    name: Restore Report
    cardinality: 0-1
    mutability: read-write
    data_type: Restore Report Object
    description: The restore report submitted by the sponsoring client as required by the RGP process.
      A client MAY provide it in the Create operation, so that the restore request and the report are
      processed atomically, or in a later Update operation while the object is in `rgpPendingRestore`
      state. A report provided in an Update operation replaces any previously submitted report.
    constraints:
    - MUST NOT be provided if the server does not require a restore report.
    - 'In EPP Compatibility Profile, the restore report is write-only: the server does not return it in
      the output of any operation, because [@!RFC3915] provides no means to retrieve a submitted report.'
    - In EPP Compatibility Profile, providing this element in the Create operation corresponds to `op="report"`,
      omitting it corresponds to `op="request"`, and providing it in the Update operation corresponds
      to `op="report"` as defined in [@!RFC3915].
    restrictions: {}
    direct_access: false
    visibility: onDemand
    notes: []
  operations:
  - identifier: create
    name: Create
    description: 'The Create operation initiates the recovery of an object in the `rgpRedemptionPeriod`
      state by creating a Restore Process Object. The server MUST reject this operation if the owning
      object is not in the `rgpRedemptionPeriod` state.

      If the server requires a restore report and `restoreReport` is absent, the object transitions to
      `rgpPendingRestore` state awaiting a subsequent Update operation. Otherwise the restore is completed
      immediately.'
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input:
    - kind: Reference
      target: Owner Data Object
      cardinality: '1'
    - kind: Object
      target: Restore Process Object
      cardinality: '1'
    - kind: Input Data Elements
      definitions:
      - identifier: restoreReport
        name: Restore Report
        cardinality: 0-1
        data_type: Restore Report Object
        description: An OPTIONAL inline restore report. If provided, the server processes the request
          and the report atomically. If the server does not require a restore report, this element MUST
          NOT be present and the restore is completed immediately. If the server requires a report and
          this element is absent, the object transitions to `pendingRestore` state awaiting a subsequent
          Report operation.
        constraints:
        - MUST NOT be provided if the server does not require a restore report.
        - In EPP Compatibility Profile, corresponds to `op="request"` (without report) or a combined `op="request"`
          followed immediately by `op="report"` as defined in [@!RFC3915].
        restrictions: {}
        notes: []
    output:
    - kind: Object
      target: Restore Process Object
      cardinality: '1'
    notes: []
  - identifier: read
    name: Read
    description: The Read operation allows the sponsoring client to retrieve the current state of the
      RGP process for an object.
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: Restore Process Object
      cardinality: '1'
    notes:
    - In EPP Compatibility Profile this operation is not supported.
  - identifier: update
    name: Update
    description: 'This operation is OPTIONAL, only for servers which support or require submission of
      a restore report.

      The Update operation submits the restore report required by the RGP process for an object in the
      `rgpPendingRestore` state. Since `restoreReport` is the only read-write data element of the Restore
      Process Object, the client MUST provide it in this operation. A report MAY be submitted more than
      once if corrections are required. The server MUST reject this operation if the object is not in
      the `rgpPendingRestore` state.'
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    - kind: Input Data Elements
      definitions:
      - identifier: restoreReport
        name: Restore Report
        cardinality: '1'
        data_type: Restore Report Object
        description: The restore report to be submitted as part of the RGP process.
        constraints:
        - In EPP Compatibility Profile, corresponds to `op="report"` as defined in [@!RFC3915].
        restrictions: {}
        notes: []
    output:
    - kind: Object
      target: Restore Process Object
      cardinality: '1'
    notes: []
  subsections: []
  supported_processes: []
  conditions: []
- identifier: renewProcess
  name: Renew Process Object
  object_type: Process
  unique_identifier: processId
  owner: ''
  extends: Base Process Object
  abstract: false
  description: Represents a renew request for a provisioned object. Creating this object initiates a renewal
    process that extends the registration period of the object. Reading this object returns the new expiry
    date if the renewal has been completed.
  preamble: []
  elements:
  - identifier: expiryDate
    name: Expiry Date
    cardinality: 0-1
    mutability: create-only
    data_type: Timestamp
    description: The current expiry date of the object. The server MUST validate this against the object's
      current `expiryDate` to prevent unintended duplicate renewals.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: renewalPeriod
    name: Renewal Period
    cardinality: 0-1
    mutability: create-only
    data_type: Period Object
    description: The duration to be added to the object's registration period. This value is used by the
      server to calculate the new `expiryDate`. The default value MAY be defined by server policy. The
      number of units available MAY be subject to limits imposed by the server.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations:
  - identifier: renewCreate
    name: Create
    description: The renew operation extends the validity period of an existing object by creating a Renew
      Process Object.
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input:
    - kind: Reference
      target: Owner Data Object
      cardinality: '1'
    - kind: Object
      target: Renew Process Object
      cardinality: '1'
    output:
    - kind: Object
      target: Renew Process Object
      cardinality: '1'
    notes: []
  subsections: []
  supported_processes: []
  conditions: []
- identifier: createProcess
  name: Create Process Object
  object_type: Process
  unique_identifier: processId
  owner: ''
  extends: Base Process Object
  abstract: false
  description: Represents the process initiated when a resource creation operation is performed. It carries
    creation-specific inputs that are consumed during the creation operation and are not stored as persistent
    attributes of the created resource object.
  preamble:
  - Beyond the data elements of the Base Process Object, the generic Create Process Object defines no
    additional data elements. Individual object definitions extend it with object-specific creation inputs
    (such as the Domain Create Process Object (#domain-create-process), which adds the registration period).
  - The Create operation is invoked implicitly as a side effect of the resource object create operation
    and is never invoked directly. It carries the creation-specific inputs consumed during the creation
    of the owning resource object.
  - The Read operation retrieves the result or status of the creation, if the server exposes the process
    resource.
  elements: []
  operations:
  - identifier: create
    name: Create
    description: The Create operation is invoked implicitly as a side effect of the resource object create
      operation and is never invoked directly. It carries the creation-specific inputs consumed during
      the creation of the owning resource object.
    authorisation:
    - Inherited from the resource object create operation that initiates this process.
    input:
    - kind: Object
      target: Create Process Object
      cardinality: '1'
    output:
    - kind: Object
      target: Create Process Object
      cardinality: '1'
    notes: []
  - identifier: read
    name: Read
    description: The Read operation retrieves the result or status of the creation, if the server exposes
      the process resource.
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: Create Process Object
      cardinality: '1'
    notes: []
  subsections: []
  supported_processes: []
  conditions: []
- identifier: domainCreateProcess
  name: Domain Create Process Object
  object_type: Process
  unique_identifier: processId
  owner: domainName
  extends: Create Process Object
  abstract: false
  description: The domain-specific Create Process Object (#create-process). It is implicitly initiated
    by the Domain Name Data Object create operation and carries the domain creation-specific inputs, namely
    the requested initial registration period, that are consumed during creation and not persisted as
    part of the domain object's state.
  preamble: []
  elements:
  - identifier: period
    name: Period
    cardinality: 0-1
    mutability: create-only
    data_type: Period Object
    description: The initial registration period for the domain name. This value is used by the server
      to calculate the initial `expiryDate` of the object.
    constraints:
    - The default value MAY be defined by server policy. The number of units available MAY be subject
      to limits imposed by the server.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations:
  - identifier: create
    name: Create
    description: The Create operation is invoked implicitly as a side effect of the Domain Name Data Object
      create operation and is never invoked directly. It carries the registration period consumed during
      domain creation.
    authorisation:
    - Inherited from the Domain Name Data Object create operation that initiates this process.
    input:
    - kind: Object
      target: Domain Create Process Object
      cardinality: '1'
    output:
    - kind: Object
      target: Domain Create Process Object
      cardinality: '1'
    notes: []
  - identifier: read
    name: Read
    description: The Read operation retrieves the result or status of the domain creation, if the server
      exposes the process resource.
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: Domain Create Process Object
      cardinality: '1'
    notes: []
  subsections: []
  supported_processes: []
  conditions: []
- identifier: domainTransferProcess
  name: Domain Transfer Process Object
  object_type: Process
  unique_identifier: processId
  owner: domainName
  extends: Transfer Process Object
  abstract: false
  description: The domain-specific Transfer Process Object (#transfer-operations). It carries the domain-specific
    transfer inputs and outputs — the requested transfer period and the resulting expiry date — that extend
    the common transfer process.
  preamble: []
  elements:
  - identifier: expiryDate
    name: Expiry Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The end of the domain object's registration period if the transfer caused or causes a
      change in the validity period.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: transferPeriod
    name: Transfer Period
    cardinality: 0-1
    mutability: create-only
    data_type: Period Object
    description: The number of units to be added to the registration period of the domain object upon
      successful completion of the transfer. The number of units available MAY be subject to limits imposed
      by the server.
    constraints:
    - In EPP Compatibility Profile, Transfer Period cannot be read from the Transfer Process Object
    restrictions: {}
    direct_access: false
    visibility: default
    notes:
    - Transfer of a Domain Name Data Object MUST implicitly transfer all Host Data Objects that are subordinate
      to the domain object. For example, if domain object "example.com" is transferred and host object
      "ns1.example.com" exists, the host object MUST be transferred as part of the "example.com" transfer
      process. Actions that do not preserve the relationship between a domain object and its subordinate
      host objects MUST be disallowed.
  operations:
  - identifier: transferCreate
    name: Create
    description: The Create operation initiates a transfer of the Domain Name Data Object by creating
      a Domain Transfer Process Object, extending the common Transfer Create Operation (#transfer-create).
    authorisation:
    - as defined in (#transfer-create).
    input:
    - kind: Reference
      target: Owner Data Object
      cardinality: '1'
    - kind: Object
      target: Domain Transfer Process Object
      cardinality: '1'
    output:
    - kind: Object
      target: Domain Transfer Process Object
      cardinality: '1'
    notes: []
  subsections: []
  supported_processes: []
  conditions: []
resources:
- identifier: domainName
  name: Domain Name Data Object
  object_type: Resource
  unique_identifier: name
  owner: ''
  extends: ''
  abstract: false
  description: A Domain Name data object represents a domain name and contains the data required for its
    provisioning and management in the registry.
  preamble:
  - The following data elements are defined for the Domain Name Data Object.
  elements:
  - identifier: name
    name: Name
    cardinality: '1'
    mutability: create-only
    data_type: Fully Qualified Domain Name
    description: The fully qualified name of the domain object.
    constraints:
    - A server MAY restrict allowable domain names to a particular top-level domain, second-level domain,
      or other domain for which the server is authoritative.
    - If the domain name is an internationalized domain name (IDN), the value MUST be a valid ACE encoded
      string representing the Unicode Name (uName).
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: uName
    name: Unicode Name
    cardinality: 0-1
    mutability: create-only
    data_type: String
    description: The fully qualified name of the domain using the Unicode character set.
    constraints:
    - The value MUST be a fully qualified domain name in Unicode Normalization Form C (NFC) as defined
      in [UNICODE.NFC].
    - The server MUST validate the Unicode Name using the procedure described in section 4.2 of [RFC5891].
    - Every code point in the value MUST be classified as a candidate for inclusion by the rules defined
      in [@!RFC5892].
    - If the value contains a code point from a script with Right-to-Left directionality, the value MUST
      satisfy the Bidi Rule defined in [@!RFC5893].
    - The Unicode (U-label) form of the domain name, when converted according to the procedures defined
      in Section 2.3.2.4 of [@!RFC5890], MUST be equal to the corresponding A-label representation.
    - Any code point valid under IDNA2003 but disallowed under IDNA2008 MUST NOT be allowed in the Unicode
      Name (uName).
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: lgr
    name: LGR
    cardinality: 0-1
    mutability: create-only
    data_type: String
    description: The name of the Label Generation Ruleset (LGR) containing the valid code points used
      for the Unicode Name (uName).
    constraints:
    - MUST NOT be empty when the Unicode Name (uName) is provided.
    - MUST be a valid LGR name registered in the IANA IDN Tables registry [IDN-Tables].
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: provMetadata
    name: Provisioning Metadata
    cardinality: '1'
    mutability: read-only
    data_type: Provisioning Metadata Object
    description: Standard metadata about the object's lifecycle and ownership.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: status
    name: Status
    cardinality: 1+
    mutability: read-write
    data_type: Domain Name Status Object
    description: The current status descriptors associated with the domain.
    constraints:
    - Possible combinations of Status Object Labels are specified in (#domain-name-status-object).
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: registrant
    name: Registrant
    cardinality: 0-1
    mutability: read-write
    data_type: Aggregation[Contact Data Object]
    description: The contact object associated with the domain as the registrant.
    constraints:
    - The relation MUST correspond to a valid Contact Data Object known to the server.
    - Servers MAY restrict association of a Contact Data Object of a different sponsoring client.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: contacts
    name: Contacts
    cardinality: 0+
    mutability: read-write
    data_type: LabelledAggregation[Contact Data Object]
    description: A collection of other contact objects associated with the domain object.
    constraints:
    - Each associated contact MUST correspond to a valid Contact Data Object known to the server before
      it can be associated with the domain.
    - Maximum number of associated contacts (per role) MAY be restricted by server policy
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: nameservers
    name: Nameservers
    cardinality: 0+
    mutability: read-write
    data_type: Aggregation[Host Data Object]
    description: A collection of nameservers associated with the domain.
    constraints:
    - A Host Data Object MUST be known to the server before it can be associated with the domain.
    - MUST not be used when 1 or more DNS Data entries are specified through the DNS Data element.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: dns
    name: DNS Data
    cardinality: 0-1
    mutability: read-write
    data_type: DNS Data Object
    description: DNS resource records and operational controls related to the domain name. This structure
      follows the unified DNS data model defined in [@I-D.simmen-rpp-dns-data], providing a single container
      for all DNS-related provisioning data including delegation, DNSSEC, and other record types.
    constraints:
    - The type of the record entries MAY be constrained by the server policy. Typically the values would
      be limited to allowed parent-side resource record types.
    - In EPP Compatibility Profile, a server MUST support NS, A, and AAAA record types for delegation,
      and with DNSSEC Extension [@RFC5910] a server MUST additionally support DS and/or DNSKEY record
      types.
    - The names of DNS entries MUST be the domain name itself or subordinate to the domain name and MUST
      NOT be below zone cut in case of present delegation.
    - A server MAY forbid use of NS/A/AAAA record types if the server only supports host object model
      through Nameserver property defining those records.
    - MUST not be used when 1 or more nameservers are specified through the Nameserver element.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: subordinateHosts
    name: Subordinate Hosts
    cardinality: 0+
    mutability: read-only
    data_type: Aggregation[Host Data Object]
    description: A collection of subordinate host objects that exist under this domain.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: expiryDate
    name: Expiry Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time identifying the end of the domain object's registration period.
    constraints:
    - The value is set by the server and cannot be specified by the client.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: authInfo
    name: Authorisation Information
    cardinality: 0-1
    mutability: read-write
    data_type: Authorisation Information Object
    description: Authorisation information associated with the domain object.
    constraints:
    - This element MUST only be returned if the querying client is the sponsoring client or if the client
      supplied valid Object Authorisation with the operation.
    restrictions: {}
    direct_access: false
    visibility: onDemand
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the domain object.
    constraints: []
    restrictions: {}
    direct_access: true
    visibility: default
    notes: []
  operations:
  - identifier: availability
    name: Availability Operation
    description: The Availability operation allows a client to determine whether a Domain Name resource
      with the given name can be created.
    authorisation:
    - Any authenticated client is authorised to perform this operation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: Domain Name Availability Object
      cardinality: '1'
    notes: []
  - identifier: create
    name: Create Operation
    description: The Create operation allows a client to provision a new Domain Name resource. The operation
      accepts as input all create-only and read-write data elements defined for the Domain Name Data Object.
    authorisation:
    - Generally each client is authorised to create new domain objects becoming a sponsoring client. This
      can be however constrained by the server policy in many ways, i.e. by applying rate limiting, billing
      related constraints or compliance locks.
    input:
    - kind: Object
      target: This Object
      cardinality: '1'
    - kind: Object
      target: Domain Create Process Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - The Create operation implicitly initiates the Domain Create Process Object (#domain-create-process),
      which carries the creation-specific inputs that are consumed during creation and not persisted as
      part of the domain object's state.
    - The server MUST validate the name using the procedure described in section 4.2 of [RFC5891]. If
      the validation of the IDN name failed because it contained a code point not available in the specified
      IDN table, the server MUST return an error indicating the invalid code point. If the name does not
      map to the provided Unicode Name (uName), the server MUST respond with an appropriate error indicating
      the mismatch.
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the data elements of a Domain Name resource.
      The server's response MAY vary depending on client authorisation and server policy.
    authorisation:
    - 'Sponsoring client:

      * Full object'
    - 'Other client:

      * Without Object Authorisation:

      * Limited object (non-confidential properties) or operation denied

      * With Object Authorisation:

      * Full object, however some properties only authorised to the sponsoring client MAY be redacted
      according to server policy'
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    - kind: Parameters
      definitions:
      - identifier: hostsFilter
        name: Hosts Filter
        cardinality: 0-1
        data_type: String
        description: Controls which host information is returned with the object.
        constraints:
        - The value MUST be one of "all", "del" (delegated), "sub" (subordinate), or "none". The default
          value is "all".
        restrictions: {}
        notes: []
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes: []
  - identifier: update
    name: Update Operation
    description: The Update operation allows a client to modify the read-write data elements of an existing
      Domain Name resource.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - At least one change to a read-write data element MUST be provided, unless the operation is extended.
      The registrant and the Authorisation Information MAY be removed. Contacts, nameservers, and the
      registrant to be added MUST be known to the server.
  - identifier: delete
    name: Delete Operation
    description: The Delete operation allows a client to remove an existing Domain Name resource. The
      operation targets a specific data object identified by its name.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: 0-1
    notes:
    - The server SHOULD reject a delete request if subordinate host objects are associated with the domain
      name.
    - The error response SHOULD indicate the related subordinate host objects.
  subsections: []
  supported_processes:
  - name: Renew Process
    constraints: []
    notes: []
  - name: Restore Process
    constraints:
    - OPTIONAL; available only when the RGP feature is supported.
    notes:
    - 'The Domain Name Data Object supports the following Process Objects extended by an object-specific
      definition:'
  - name: Domain Create Process
    constraints: []
    notes: []
  - name: Domain Transfer Process
    constraints: []
    notes: []
  conditions: []
- identifier: contact
  name: Contact Data Object
  object_type: Resource
  unique_identifier: id
  owner: ''
  extends: ''
  abstract: false
  description: A Contact Data Object represents the contact information for an individual or organisation
    associated with other objects.
  preamble:
  - The following data elements are defined for the Contact Data Object.
  elements:
  - identifier: id
    name: Handle ID
    cardinality: '1'
    mutability: create-only
    data_type: Identifier
    description: External unique identifier of the contact object.
    constraints:
    - This value MUST be supported to be provided by the client.
    - Servers MAY support server-side generation of this value.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: provMetadata
    name: Provisioning Metadata
    cardinality: '1'
    mutability: read-only
    data_type: Provisioning Metadata Object
    description: Standard metadata about the object's lifecycle and ownership.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: status
    name: Status
    cardinality: 1+
    mutability: read-write
    data_type: Contact Status Object
    description: Status descriptors associated with the contact.
    constraints:
    - Possible combinations of Contact Status Labels are specified in [Contact Status Values](#contact-status-values).
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: contactInfo
    name: Contact Information
    cardinality: '1'
    mutability: read-write
    data_type: External:RPP-JSContact-Profile:Card
    description: Contains contact information.
    constraints:
    - In EPP Compatibility Profile, at most one internationalised and one localised form of the contact
      information are provided. The internationalised form MUST be represented in a subset of UTF-8 that
      can be represented in the 7-bit US-ASCII character set, while the localised form MAY be represented
      in unrestricted UTF-8.
    - In EPP Compatibility Profile, a postal address consists of up to three street lines, a city, an
      OPTIONAL state or province, an OPTIONAL postal code, and a country code that is a two-character
      identifier as specified in ISO 3166-1.
    - In EPP Compatibility Profile, telephone numbers MUST begin with a plus sign ("+"), followed by a
      country code defined in ITU-T E.164, followed by a dot ("."), followed by a sequence of digits,
      and MAY note an extension. Email addresses MUST conform to the syntax defined in [@!RFC5322].
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: authInfo
    name: Authorisation Information
    cardinality: 0-1
    mutability: read-write
    data_type: Authorisation Information Object
    description: Authorisation information associated with the contact object.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: onDemand
    notes: []
  - identifier: disclose
    name: Disclose
    cardinality: 0-1
    mutability: read-write
    data_type: Disclose Object
    description: Identifies elements that require exceptional server-operator handling to allow or restrict
      disclosure to third parties.
    constraints:
    - A server MUST reject any transaction that requests disclosure practices that do not conform to the
      server's announced data-collection policy.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the contact object.
    constraints: []
    restrictions: {}
    direct_access: true
    visibility: default
    notes: []
  operations:
  - identifier: availability
    name: Availability Operation
    description: The Availability operation allows a client to determine whether a Contact resource with
      the given Handle ID can be created.
    authorisation:
    - Any authenticated client is authorised to perform this operation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: Contact Availability Object
      cardinality: '1'
    notes: []
  - identifier: create
    name: Create Operation
    description: The Create operation allows a client to provision a new Contact resource. The operation
      accepts as input all create-only and read-write data elements defined for the Contact Data Object.
    authorisation:
    - Generally each client is authorised to create new contact objects becoming a sponsoring client.
      This can be however constrained by the server policy, e.g. by applying rate limiting or compliance
      locks.
    input:
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - 'In EPP Compatibility Profile, the following data elements MUST be provided:'
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the data elements of a Contact resource.
      The server's response MAY vary depending on client authorisation and server policy.
    authorisation:
    - 'Sponsoring client:

      * Full object'
    - 'Other client:

      * Without Object Authorisation:

      * Limited object (non-confidential properties) or operation denied

      * With Object Authorisation:

      * Full object, however some properties only authorised to the sponsoring client MAY be redacted
      according to server policy'
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - Authorisation Information (`authInfo`) MUST NOT be provided in the response if the querying client
      is not the current sponsoring client.
    - When constructing the response, the server MUST respect the disclosure policies defined by the Disclose
      Object (`disclose`), whether set by the server operator's default data-collection policy or by the
      sponsoring client for the contact. Data elements marked for non-disclosure MUST NOT be included
      in responses to unauthorised clients.
  - identifier: update
    name: Update Operation
    description: The Update operation allows a client to modify the attributes of an existing Contact
      resource.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - 'The following aspects of the contact object MAY be modified:'
    - At least one change MUST be provided, unless the operation is extended.
  - identifier: delete
    name: Delete Operation
    description: The Delete operation allows a client to remove an existing Contact resource. The operation
      targets a specific data object identified by its Handle ID.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: 0-1
    notes:
    - The server SHOULD reject a delete request if the contact object is associated with other known objects
      (e.g., domain names). An associated contact SHOULD NOT be deleted until associations with other
      known objects have been broken.
    - The error response SHOULD indicate the existing object associations.
  subsections: []
  supported_processes:
  - name: Transfer Process
    constraints: []
    notes:
    - The Contact Data Object supports no Process Objects extended by an object-specific definition.
  conditions: []
- identifier: host
  name: Host Data Object
  object_type: Resource
  unique_identifier: hostName
  owner: ''
  extends: ''
  abstract: false
  description: A Host Data Object represents a name server that provides DNS services for a domain name.
  preamble:
  - The following data elements are defined for the Host Data Object.
  elements:
  - identifier: hostName
    name: Host Name
    cardinality: '1'
    mutability: read-write
    data_type: Fully Qualified Domain Name
    description: Fully qualified name of a host.
    constraints:
    - An Internal host MUST be treated as a subordinate host when it is used as a nameserver for a domain
      other than its superordinate domain.
    - Actions that do not preserve the relationship between a host object and its superordinate domain
      object MUST be disallowed.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: provMetadata
    name: Provisioning Metadata
    cardinality: '1'
    mutability: read-only
    data_type: Provisioning Metadata Object
    description: Standard metadata about the object's lifecycle and ownership.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: status
    name: Status
    cardinality: 1+
    mutability: read-write
    data_type: Host Status Object
    description: The current status descriptors associated with the host.
    constraints:
    - Possible combinations of Host Status Labels are specified in [Host Status Values](#host-status-values)
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: dns
    name: DNS Data
    cardinality: 0-1
    mutability: read-write
    data_type: DNS Data Object
    description: DNS resource records and operational controls related to the host. This structure follows
      the unified DNS data model defined in [@I-D.simmen-rpp-dns-data].
    constraints:
    - The names of DNS entries MUST be the host name itself or subordinate to the host name.
    - In EPP Compatibility Profile the record entries MUST be limited to A and AAAA entries for IPv4 and
      IPv6 glue records respectively.
    - In EPP Compatibility Profile, IPv4 addresses MUST conform to [@!RFC0791] and IPv6 addresses MUST
      conform to [@!RFC4291]. A server MAY reject IP addresses that have not been allocated for public
      use by IANA.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the host object.
    constraints: []
    restrictions: {}
    direct_access: true
    visibility: default
    notes: []
  operations:
  - identifier: availability
    name: Availability Operation
    description: The Availability operation allows a client to determine whether a Host Data Object with
      the given host name can be created.
    authorisation:
    - Any authenticated client is authorised to perform this operation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: Host Availability Object
      cardinality: '1'
    notes: []
  - identifier: create
    name: Create Operation
    description: The Create operation allows a client to provision a new Host Data Object. The operation
      accepts as input all create-only and read-write data elements defined for the Host Data Object.
    authorisation:
    - Generally each client is authorised to create new host objects becoming a sponsoring client. This
      can be however constrained by the server policy, e.g. by applying rate limiting or compliance locks.
    input:
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - If the host name exists in a namespace for which the server is authoritative, then the superordinate
      domain of the host MUST be known to the server before the host object can be created.
    - In EPP Compatibility Profile, IP addresses are REQUIRED only as needed to produce DNS glue records.
      If the host name exists in a namespace for which the server is authoritative and is subordinate
      to an existing domain, IP addresses SHOULD be provided. If the host name is external to the server's
      namespace, IP addresses are not required by the DNS and MAY be omitted.
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the data elements of a Host Data Object.
    authorisation:
    - Any client is authorised to retrieve the full object. In EPP Compatibility Profile, host objects
      do not carry authorisation information and there is no distinction based on client identity as described
      in [@!RFC5732, section 3.1.2].
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes: []
  - identifier: update
    name: Update Operation
    description: The Update operation allows a client to modify the attributes of an existing Host Data
      Object. The operation targets a specific data object identified by its host name.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - Host name changes MAY require the addition or removal of IP addresses to be accepted by the server.
      IP address association MAY be subject to server policies for provisioning hosts as name servers.
      The IP address restrictions described for the Create operation apply to updates as well.
    - At least one change to a data element MUST be provided, unless the operation is extended.
    - 'Host name changes can have an impact on associated objects that refer to the host object. A Host
      Name change SHOULD NOT require additional updates of associated objects to preserve existing associations,
      with one exception: changing an External host object that has associations with objects that are
      sponsored by a different client. Attempts to update such hosts directly MUST fail. The change can
      be provisioned by creating a new External host with a new name and any needed new attributes, and
      subsequently updating the other objects sponsored by the client.'
  - identifier: delete
    name: Delete Operation
    description: The Delete operation allows a client to remove an existing Host Data Object. The operation
      targets a specific data object identified by its host name.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: 0-1
    notes:
    - The server SHOULD reject a delete request if the host object is associated with any other object,
      such as a domain name object. Deleting a host object without first breaking existing associations
      can cause DNS resolution failure for domain objects that refer to the deleted host object.
    - The error response SHOULD indicate the related associated objects.
  subsections: []
  supported_processes:
  - name: Transfer Process
    constraints:
    - Host objects MUST NOT be transferred directly. They are transferred implicitly when their superordinate
      domain object is transferred.
    notes:
    - The Host Data Object supports no Process Objects (#process-objects) extended by an object-specific
      definition.
  conditions: []
- identifier: organisation
  name: Organisation Data Object
  object_type: Resource
  unique_identifier: id
  owner: ''
  extends: ''
  abstract: false
  description: An Organisation Data Object represents an entity, such as a registrar or reseller that
    is involved in the domain registration process. This object is based on the EPP Organisation Mapping
    defined in [@!RFC8543].
  preamble:
  - The following data elements are defined for the Organisation Data Object.
  elements:
  - identifier: id
    name: Organisation ID
    cardinality: '1'
    mutability: create-only
    data_type: Identifier
    description: A server-unique identifier for the organisation object.
    constraints:
    - This value MUST be supported to be provided by the client.
    - Servers MAY support server-side generation of this value.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: provMetadata
    name: Provisioning Metadata
    cardinality: '1'
    mutability: read-only
    data_type: Provisioning Metadata Object
    description: Standard metadata about the object's lifecycle and ownership.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: status
    name: Status
    cardinality: 1+
    mutability: read-write
    data_type: Organisation Status Object
    description: The current operational status descriptors associated with the organisation. An organisation
      object MUST always have at least one associated status value.
    constraints:
    - Possible combinations of Organisation Status Labels are specified in [Organisation Status Values](#organisation-status-values).
    - A client MUST NOT alter server status values set by the server itself.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: roles
    name: Roles
    cardinality: 1+
    mutability: read-write
    data_type: DictionaryComposition[Organisation Role Object]
    description: One or more roles describing the relationship the organisation has within the registry
      ecosystem. An organisation object MUST always have at least one associated role.
    constraints:
    - An organisation MAY have multiple roles with different role types.
    - Role types are registered in the IANA "EPP Organisation Role Values" registry as defined in [@!RFC8543,
      section 7.3]. Initial values include `registrar`, `reseller`, `privacyproxy`, and `dns-operator`.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: parent
    name: Parent Organisation
    cardinality: 0-1
    mutability: read-write
    data_type: Aggregation[Organisation Data Object]
    description: The parent organisation in a hierarchical organisation structure (e.g., a reseller's
      parent registrar).
    constraints:
    - Loops MUST be prohibited. If organisation A has organisation B as its parent, organisation B MUST
      NOT have organisation A as its parent, directly or transitively.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: contactInfo
    name: Contact Information
    cardinality: 0-1
    mutability: read-write
    data_type: External:RPP-JSContact-Profile:Card
    description: Contact information for the organisation.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: contacts
    name: Contacts
    cardinality: 0+
    mutability: read-write
    data_type: LabelledAggregation[Contact Data Object]
    description: Identifiers of contact objects associated with the organisation.
    constraints:
    - Contact object identifiers MUST be known to the server before the contact can be associated.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: users
    name: Users
    cardinality: 0+
    mutability: read-write
    data_type: LabelledAggregation[User Data Object]
    description: One or more RBAC roles assigned to the user.
    constraints:
    - Each role value MUST be a non-empty string.
    - Allowed role values MAY be constrained by server policy.
    restrictions: {}
    direct_access: true
    visibility: default
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the organisation object.
    constraints: []
    restrictions: {}
    direct_access: true
    visibility: default
    notes: []
  operations:
  - identifier: create
    name: Create Operation
    description: The Create operation allows a client to provision a new Organisation Data Object. The
      operation accepts as input all create-only and read-write data elements defined for the Organisation
      Data Object.
    authorisation:
    - Generally only registry clients are authorised to create new organisation objects.
    input:
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - An organisation object MUST include at least one role on creation. The server MAY defer completing
      the action and return a `pendingCreate` status if human or third-party review is required.
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the data elements of an Organisation Data
      Object.
    authorisation:
    - Any client is authorised to retrieve organisation object information. The server MAY restrict the
      information returned based on client identity and server policy.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes: []
  - identifier: update
    name: Update Operation
    description: The Update operation allows a client to modify the attributes of an existing Organisation
      Data Object.
    authorisation:
    - Generally only registry clients are authorised to update organisation objects.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - 'The following aspects of the organisation object MAY be modified:'
    - A client MUST NOT add, delete, or alter values for statuses managed by the server (prefixed with
      "server"). A server MAY add, delete, or alter status values set by a client, subject to server policy.
  - identifier: delete
    name: Delete Operation
    description: The Delete operation allows a client to remove an existing Organisation Data Object.
      The operation targets a specific data object identified by its Organisation ID.
    authorisation:
    - Generally only registry clients are authorised to delete organisation objects.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: 0-1
    notes:
    - An organisation object MUST NOT be deleted if it is associated with other known objects (e.g., domain
      names, contacts, or child organisations). The server MUST reject such a delete request and notify
      the client that object relationships exist.
    - The error response SHOULD indicate the related associated objects.
  subsections: []
  supported_processes: []
  conditions: []
- identifier: message
  name: Message Data Object
  object_type: Resource
  unique_identifier: id
  owner: ''
  extends: ''
  abstract: false
  description: A Message Data Object represents a message which is inserted in the message queue of an
    organisation and retrieved by clients associated with that organisation.
  preamble:
  - The following data elements are defined for the Message Data Object.
  elements:
  - identifier: id
    name: Message ID
    cardinality: '1'
    mutability: read-only
    data_type: Identifier
    description: A server-unique identifier for the message object.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: creationDate
    name: Creation Date
    cardinality: '1'
    mutability: read-only
    data_type: Timestamp
    description: The date and time when the message object was created and inserted into the queue.
    constraints:
    - The value is set by the server.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: status
    name: Status
    cardinality: '1'
    mutability: read-only
    data_type: String
    description: The current lifecycle status of the message object.
    constraints: []
    restrictions:
      allowed_values:
      - queued
      - delivered
      - removed
    direct_access: false
    visibility: default
    notes: []
  - identifier: data
    name: Data
    cardinality: '1'
    mutability: create-only
    data_type: Base Message Object
    description: The data related to a specific message type, such as a transfer request or a review response.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations:
  - identifier: create
    name: Create Operation
    description: The Create operation allows a server to insert a new message into the queue for a registrar.
      The operation accepts as input all create-only and read-write data elements defined for the Message
      Data Object.
    authorisation:
    - Only the server is authorised to create new message objects.
    input:
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes: []
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the data elements of a Message Data Object.
    authorisation:
    - Any client is authorised to retrieve message object information. The server MAY restrict the information
      returned based on client identity and server policy.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes:
    - Organisation ID (`owner`) MUST NOT be provided in the response, since a client can only ever retrieve
      messages linked to its own organisation.
  - identifier: query
    name: Query Operation
    description: The Query operation allows a client to retrieve a collection of Message Data Object instances
      based on specified criteria.
    authorisation:
    - Any client is authorised to retrieve message object information. The server MAY restrict the information
      returned based on client identity and server policy.
    input:
    - kind: Parameters
      definitions:
      - identifier: type
        name: Message Type
        cardinality: 0-1
        data_type: String
        description: The type of the message to use as a filter when retrieving message objects.
        constraints:
        - The type value MUST be a valid identifier for an RPP message component (e.g. reviewResponse).
        restrictions: {}
        notes: []
    output:
    - kind: Object
      target: This Object
      cardinality: 0+
    notes: []
  - identifier: delete
    name: Delete Operation
    description: The Delete operation allows a client to remove an existing Message Data Object. The operation
      targets a specific data object identified by its Message ID.
    authorisation:
    - Generally clients are authorised to delete message objects linked to the organisation the client
      belongs to.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: 0-1
    notes: []
  subsections: []
  supported_processes: []
  conditions: []
- identifier: user
  name: User Data Object
  object_type: Resource
  unique_identifier: id
  owner: ''
  extends: ''
  abstract: false
  description: Represents a user linked to an Organisation Object. Each user carries a set of RBAC roles
    that define the user's permissions within the context of the owning Organisation Object. The lifecycle
    of a User Object is bound to its Organisation Object.
  preamble:
  - The following data elements are defined for the User Data Object.
  elements:
  - identifier: id
    name: User Identifier
    cardinality: '1'
    mutability: create-only
    data_type: Identifier
    description: A unique identifier for the user
    constraints:
    - MUST be globally unique in the server scope
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: details
    name: Details
    cardinality: '1'
    mutability: read-write
    data_type: External:RPP-JSContact-Profile:Card
    description: The details of the user, such as name, email, and phone number
    constraints:
    - '-'
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: description
    name: Description
    cardinality: 0-1
    mutability: read-write
    data_type: String
    description: A description of the user
    constraints:
    - '-'
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: status
    name: Status
    cardinality: '1'
    mutability: read-write
    data_type: User Status Object
    description: The current status of the user.
    constraints:
    - Allowed status values and transitions are specified in [User Status Values](#user-status-values).
    - A client MUST NOT alter server status values set by the server itself.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: organisation
    name: Organisation
    cardinality: '1'
    mutability: read-only
    data_type: Aggregation[Organisation Data Object]
    description: A reference to the owner organisation object.
    constraints:
    - '-'
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the user object.
    constraints: []
    restrictions: {}
    direct_access: true
    visibility: default
    notes: []
  operations:
  - identifier: create
    name: Create Operation
    description: The Create operation creates a new user, which is associated with an existing Organisation
      Object. The operation accepts as input all create-only and read-write data elements of the User
      Object.
    authorisation:
    - Client can only create users in the context of the organisation linked to the client, and only if
      the client has the necessary permissions to create users in that organisation.
    input:
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes: []
  - identifier: read
    name: Read Operation
    description: The Read operation retrieves the data of a specific User Object.
    authorisation:
    - Client can only read users in the context of the organisation linked to the client, and only if
      the client has the necessary permissions to read users in that organisation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes: []
  - identifier: update
    name: Update Operation
    description: The Update operation modifies the read-write data elements.
    authorisation:
    - Client can only update users in the context of the organisation linked to the client, and only if
      the client has the necessary permissions to update users in that organisation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    - kind: Object
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes: []
  - identifier: delete
    name: Delete Operation
    description: The Delete operation removes a specific User Object.
    authorisation:
    - Client can only delete users in the context of the organisation linked to the client, and only if
      the client has the necessary permissions to delete users in that organisation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: 0-1
    notes:
    - The server MUST reject this operation if the target User Object is the last user of the owning organisation
      that is permitted to manage users.
    - User Objects are deleted together with their owning Organisation Object.
  subsections: []
  supported_processes: []
  conditions: []
- identifier: discovery
  name: Discovery Data Object
  object_type: Resource
  unique_identifier: ''
  owner: ''
  extends: ''
  abstract: false
  description: A Discovery Data Object describes the capabilities of an RPP server, such as the supported
    versions, TLDs, extensions, profiles, resource collections, authentication methods and endpoints.
    The server provides a single Discovery Data Object, which is therefore not identified by a Unique
    Identifier.
  preamble:
  - The following data elements are defined for the Discovery Data Object.
  elements:
  - identifier: versions
    name: Versions
    cardinality: 1+
    mutability: read-only
    data_type: Discovery Version Object
    description: The versions of RPP supported by the server.
    constraints:
    - An operator that supports more than one incompatible version MUST deploy them on distinct base URLs
      and announce each of them.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: environment
    name: Environment
    cardinality: '1'
    mutability: read-only
    data_type: Discovery Environment Object
    description: Information about the RPP server.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: tlds
    name: TLDs
    cardinality: 1+
    mutability: read-only
    data_type: String
    description: The TLDs supported by the server, for example "example" or "org".
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: extensions
    name: Extensions
    cardinality: 0+
    mutability: read-only
    data_type: Extension Object
    description: The extensions supported by the server.
    constraints:
    - The server MUST include the version of each extension.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: profiles
    name: Profiles
    cardinality: 0+
    mutability: read-only
    data_type: String
    description: The names of the profiles supported by the server.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: objects
    name: Objects
    cardinality: 1+
    mutability: read-only
    data_type: String
    description: The list of identifiers of data objects supported by the server
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: datetime
    name: Date and Time
    cardinality: '1'
    mutability: read-only
    data_type: Timestamp
    description: The current date and time of the server.
    constraints:
    - The value MUST be expressed in UTC using the `Z` suffix, for example `2026-06-01T10:00:00Z`, and
      MUST NOT use a numeric UTC offset or any other time zone.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: links
    name: Links
    cardinality: 0+
    mutability: read-only
    data_type: LabelledAggregation[String]
    description: Links to documents related to the use of RPP with the server, such as policies and terms.
      Each value is the location of a linked document, labelled with its relation type.
    constraints:
    - Each value MUST be an absolute URL using the HTTPS scheme.
    - The document MUST be accessible to the client without authentication.
    - A server SHOULD provide a link for each of the `privacy-policy` and `terms-of-service` relation
      types, defined in [@!RFC6903].
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: idnLgr
    name: IDN LGRs
    cardinality: 0+
    mutability: read-only
    data_type: Discovery IDN LGR Object
    description: The Label Generation Rulesets (LGRs) supported by the server.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: notices
    name: Notices
    cardinality: 0+
    mutability: read-only
    data_type: Discovery Notice Object
    description: The objects allowed for provisioning operations, for example "domainName", "host" or
      "contact".
    constraints:
    - The values MUST be valid object identifiers as defined in the RPP Data Object Registry.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations:
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the Discovery Data Object. It is the only
      operation supported for this object.
    authorisation:
    - Any client is authorised to perform this operation. The operation MUST be available without authentication,
      so that a client can retrieve it before authenticating with the server.
    input: []
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes: []
  subsections: []
  supported_processes: []
  conditions: []
- identifier: profile
  name: Profile Data Object
  object_type: Resource
  unique_identifier: name
  owner: ''
  extends: ''
  abstract: false
  description: A Profile Data Object represents a named set of protocol features and versions that defines
    the compatibility and capabilities of RPP server implementations. A profile is published by the server,
    and a client can retrieve it to determine which features, objects and extensions it can use.
  preamble:
  - The following data elements are defined for the Profile Data Object. All data elements are managed
    by the server.
  elements:
  - identifier: name
    name: Name
    cardinality: '1'
    mutability: read-only
    data_type: String
    description: A unique name that identifies the profile.
    constraints:
    - The name of a standard profile, which is published in the IANA registry for RPP profiles, MUST use
      the RPP URN namespace, for example `urn:ietf:params:rpp:profile:{profile_name}`, and MUST be unique
      within that namespace. It SHOULD be descriptive of the features and versions included in the profile.
    - The name of a private profile, which is not published in the IANA registry, MUST be globally unique.
      The use of reverse domain name notation is RECOMMENDED.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: description
    name: Description
    cardinality: '1'
    mutability: read-only
    data_type: String
    description: A human-readable description of the profile and its intended use.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: version
    name: Version
    cardinality: '1'
    mutability: read-only
    data_type: String
    description: The version of the profile.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: rppVersion
    name: RPP Version
    cardinality: '1'
    mutability: read-only
    data_type: String
    description: The minimum version of the RPP protocol that is supported or required for the profile.
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: objects
    name: Objects
    cardinality: 1+
    mutability: read-only
    data_type: String
    description: The list of identifiers of data objects supported by the server
    constraints: []
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: extensions
    name: Extensions
    cardinality: 0+
    mutability: read-only
    data_type: Extension Object
    description: The extensions, including their names and versions, that are supported or required for
      the profile.
    constraints:
    - A profile MUST NOT list the same extension name more than once.
    - The server MUST support all extensions listed in the profile.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: baseProfile
    name: Base Profile
    cardinality: 0-1
    mutability: read-only
    data_type: Aggregation[Profile Data Object]
    description: A base profile that is extended by this profile. The features and versions of the base
      profile are included in this profile, which MAY add to them or override them, for example the version
      of an extension.
    constraints:
    - The base profile MUST be published in the IANA registry for RPP profiles, or be made available to
      the client using other means.
    - 'The depth of inheritance MUST be limited to 1: the base profile MUST NOT itself have a base profile.'
    - A profile MUST NOT be its own base profile.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  - identifier: defaultProfile
    name: Default Profile
    cardinality: '1'
    mutability: read-only
    data_type: Boolean
    description: The default profile that is used when no specific profile is requested by the client.
    constraints:
    - The default profile MUST be published in the IANA registry for RPP profiles, or be made available
      to the client using other means.
    - Only one profile MUST be designated as the default profile.
    restrictions: {}
    direct_access: false
    visibility: default
    notes: []
  operations:
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the Profile Data Object identified by
      its name. It is the only operation supported for this object.
    authorisation:
    - Any authenticated client is authorised to perform this operation.
    input:
    - kind: Reference
      target: This Object
      cardinality: '1'
    output:
    - kind: Object
      target: This Object
      cardinality: '1'
    notes: []
  subsections: []
  supported_processes: []
  conditions: []
